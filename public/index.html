<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1018">
  <title>Worship Loop — Preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1018; color: #eef4ff; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 520px; }
    .mark { font-size: 48px; color: #82b5ff; }
    h1 { margin: 8px 0; font-size: 32px; }
    p { color: #a9b8cc; }
    .status { display: inline-block; margin-top: 12px; padding: 7px 12px; border: 1px solid #34465d; border-radius: 99px; color: #cfe2ff; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♫</div>
    <h1>Worship Loop</h1>
    <p>We are rebuilding the app from a clean starting point.</p>
    <div class="status">Fresh start in progress</div>
  </main>
</body>
</html>
